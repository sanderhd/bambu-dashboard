<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111315">
<title>Offline · Bambu Dashboard</title>
<style>
  :root { --bg: #f4f4f1; --card: #fff; --ink: #1b1d1f; --muted: #6b7076; --line: #e3e3de; --accent: #00ae42; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111315; --card: #1a1d20; --ink: #eceeef; --muted: #8d949b; --line: #2a2e33; --accent: #2fd36b; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
    background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; max-width: 380px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 12px 0 6px; }
  p { color: var(--muted); margin: 0 0 18px; }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 9px; padding: 10px 18px; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>Dashboard unreachable</h1>
    <p>Your phone can't reach the Bambu Dashboard right now. Check your connection, or whether the Pi is on.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
