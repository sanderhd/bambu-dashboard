services:
  bambu-dashboard:
    build:
      context: .
      args:
        # Set to "true" for X1 / H2 printers (their camera needs ffmpeg).
        INSTALL_FFMPEG: "false"
    image: bambu-dashboard
    container_name: bambu-dashboard
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      # Password, settings and print history. A named volume (not a host folder) so it is
      # owned by the container's user and survives updates and rebuilds.
      - bambu-data:/app/data

volumes:
  bambu-data:
